name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release from main (e.g. 1.6.2); the tag v<version> is created'
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate script and translations
        run: python build.py --no-exe
      - name: Validate Windows runtime compatibility and regressions
        shell: powershell
        run: |
          & ./tests/validate.ps1
          & ./tests/power-limits.ps1
          & ./tests/runtime.ps1

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: python build.py

      - name: Check version matches tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then TAG="v${{ github.event.inputs.version }}"; else TAG="${{ github.ref_name }}"; fi
          VER="${TAG#v}"
          test -f "dist/ClevoTune (v$VER).exe" || { echo "version in src/app.ps1 does not match tag $TAG"; ls dist; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Release notes
        run: python .github/release_notes.py "$VER" > notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ClevoTune ${{ env.VER }}
          body_path: notes.md
          files: |
            dist/ClevoTune (v${{ env.VER }}).zip
            dist/ClevoTune (v${{ env.VER }}).exe
            dist/ClevoTune (v${{ env.VER }}).cmd
